name: Julia Pre-Release

# Split out of CI.yml, matching H2Trees and H2Factory. `nightly` used to be a row in the CI
# matrix, which meant an upstream pre-release regression reddened every pull request until Julia
# fixed it, attaching the noise to whichever change happened to be open. Weekly plus
# `continue-on-error` keeps the early warning without that.
on:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHON: ~

jobs:
  test:
    name: Julia pre-release - Linux - 1 thread
    runs-on: ubuntu-latest
    timeout-minutes: 60
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: pre
      - uses: julia-actions/cache@v3
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
        env:
          JULIA_NUM_THREADS: '1'
